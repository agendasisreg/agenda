<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de CSV - SONIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #27ae60;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .upload-area {
            border: 2px dashed var(--border);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
            cursor: pointer;
        }

        .upload-area:hover { border-color: var(--primary); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        th {
            background: #f1f5f9;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tr:hover { background: #f8fafc; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-rede { background: #dcfce7; color: #166534; }
        .tag-local { background: #fee2e2; color: #991b1b; }
        .tag-vigencia { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
        
        .conflito {
            background-color: #fef2f2 !important;
            border-left: 4px solid #ef4444;
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            font-size: 0.7rem;
            display: block;
            margin-top: 4px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .stat-card { font-weight: 600; }
        .stat-card span { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Visualizador e Validador de Escalas CSV</h1>

    <div class="stats" id="statsArea" style="display: none;">
        <div class="stat-card">Total de Linhas: <span id="totalLinhas">0</span></div>
        <div class="stat-card">Conflitos Detectados: <span id="totalConflitos" style="color: #ef4444;">0</span></div>
    </div>

    <div class="upload-area" id="dropZone">
        <p>Arraste o arquivo CSV da unidade aqui ou clique para selecionar</p>
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <div id="tabelaResultado" style="overflow-x: auto;">
        <table id="tabelaDados">
            <thead>
                <tr>
                    <th>UPS / Proc.</th>
                    <th>Profissional (CPF)</th>
                    <th>Vigência</th>
                    <th>Dia / Horário</th>
                    <th>Vagas (Fichas/Res/Ret)</th>
                    <th>Quebra / Min</th>
                    <th>Agenda</th>
                    <th>Exames (Subitens)</th>
                    <th>Observação</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const tbody = document.querySelector('#tabelaDados tbody');

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => processCSV(e.target.result);
        reader.readAsText(file, 'ISO-8859-1'); // Comum em CSVs de órgãos oficiais
    }

    function processCSV(text) {
        const linhas = text.split('\n');
        tbody.innerHTML = '';
        let conflitosCount = 0;
        let listaEscalas = [];

        // Ignorar cabeçalho e linhas vazias
        const dados = linhas.slice(1).filter(l => l.trim() !== '');

        dados.forEach((linha, index) => {
            const col = linha.split(';');
            if (col.length < 10) return;

            // Extração e Formatação (Garantindo zeros à esquerda)
            const escala = {
                ups: col[0].trim().padStart(7, '0'),
                pa: col[1].trim().padStart(7, '0'),
                cpf: col[2].trim().padStart(11, '0'),
                vini: col[4].trim(),
                vfim: col[5].trim(),
                quebra: col[6].trim(), // 0 ou 1
                agenda: col[7].trim(), // 0 ou 1
                dia: col[9].trim(),
                hIni: col[10].trim(),
                hFim: col[11].trim(),
                fichas: parseInt(col[12]) || 0,
                retornos: parseInt(col[14]) || 0,
                reservas: parseInt(col[16]) || 0,
                minutos: col[13] || col[15] || col[17] || '0',
                exames: col[18] ? col[18].trim().split(' ').map(e => e.padStart(7, '0')).join(' ') : '-',
                obs: col[19] || '-'
            };

            // Lógica de Detecção de Conflito (Mesmo Profissional, Proc, Dia, Hora e Vigência)
            const conflito = listaEscalas.find(e => 
                e.cpf === escala.cpf && 
                e.pa === escala.pa && 
                e.dia === escala.dia && 
                e.hIni === escala.hIni && 
                e.vini === escala.vini
            );

            if (conflito) conflitosCount++;
            listaEscalas.push(escala);

            renderLinha(escala, !!conflito);
        });

        document.getElementById('statsArea').style.display = 'flex';
        document.getElementById('totalLinhas').textContent = dados.length;
        document.getElementById('totalConflitos').textContent = conflitosCount;
    }

    function renderLinha(e, temConflito) {
        const tr = document.createElement('tr');
        if (temConflito) tr.className = 'conflito';

        const totalVagas = e.fichas + e.retornos + e.reservas;

        tr.innerHTML = `
            <td><strong>${e.ups}</strong><br>${e.pa}</td>
            <td>${e.cpf} ${temConflito ? '<span class="error-msg">⚠️ CONFLITO DETECTADO</span>' : ''}</td>
            <td><span class="badge tag-vigencia">${e.vini} - ${e.vfim}</span></td>
            <td>${e.dia}<br><strong>${e.hIni} - ${e.hFim}</strong></td>
            <td><strong>${totalVagas}</strong><br><small>(F:${e.fichas} R:${e.reservas} T:${e.retornos})</small></td>
            <td>${e.quebra === '0' ? 'Chegada' : 'Horário'}<br>${e.minutos} min</td>
            <td>${e.agenda === '0' ? '<span class="badge tag-rede">REDE</span>' : '<span class="badge tag-local">LOCAL</span>'}</td>
            <td><div style="max-width:200px; word-wrap: break-word;">${e.exames}</div></td>
            <td><small>${e.obs}</small></td>
        `;
        tbody.appendChild(tr);
    }

    // Suporte a Drag and Drop
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary)'; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = 'var(--border)'; };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border)';
        handleFile(e.dataTransfer.files[0]);
    };
</script>

</body>
</html>
